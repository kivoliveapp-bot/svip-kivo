<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIVO - SVIP Rules</title>

    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #f5f5f5;
    color: #111;
    font-family: Arial, Tahoma, sans-serif;
}

.header {
    height: 65px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

.header h2 {
    font-size: 22px;
    margin: 0;
}

.back {
    position: absolute;
    left: 22px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 30px;
    color: #111;
    text-decoration: none;
    cursor: pointer;
}

.container {
    padding: 12px;
    max-width: 760px;
    margin: auto;
}

.card {
    background: #fff;
    border-radius: 22px;
    padding: 22px;
    margin-bottom: 22px;
}

.rules-text {
    font-size: 18px;
    line-height: 1.85;
    margin: 0;
    direction: ltr;
    text-align: left;
}

h3 {
    font-size: 20px;
    margin: 0 0 18px;
}

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    direction: ltr;
}

th, td {
    border: 1px solid #d9d9d9;
    text-align: center;
    padding: 17px 5px;
    font-size: 16px;
    overflow-wrap: anywhere;
}

th {
    font-weight: normal;
    font-size: 17px;
}

td {
    height: 57px;
}

.level {
    font-weight: normal;
}

.points {
    font-weight: normal;
}

.note-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.note {
    font-size: 17px;
    line-height: 1.9;
    direction: ltr;
    text-align: left;
    margin-bottom: 24px;
}

.note:last-child {
    margin-bottom: 0;
}

@media (max-width: 400px) {
    .card {
        padding: 16px;
        border-radius: 18px;
    }

    .rules-text {
        font-size: 16px;
    }

    th, td {
        font-size: 14px;
        padding: 15px 3px;
    }

    h3, .note-title {
        font-size: 18px;
    }

    .note {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<main class="container">

    <section class="card">
        <p class="rules-text">
        <div data-string="svip1"></div>
        </p>
    </section>

    <section class="card">
        <h3><div data-string="svip4"></div></h3>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th><div data-string="svip6"></div></th>
                    <th><div data-string="svip3"></div></th>
                    <th><div data-string="svip7"></div></th>
                </tr>
                </thead>

                <tbody id="levelsTable"></tbody>
            </table>
        </div>
    </section>

    <section class="card">
        <div class="note-title"><div data-string="svip5"></div></div>

        <p class="note">
        <div data-string="svip2"></div>
        </p>
    </section>

</main>

<script>
const levels = [
    { level: "SVIP1",  coins: 100,   points: 10000 / 100 },
    { level: "SVIP2", coins: 500,  points: 500 },
    { level: "SVIP3", coins: 1000,  points: 1000 },
    { level: "SVIP4", coins: 3000,  points: 3000 },
    { level: "SVIP5", coins: 7000, points: 5000 },
    { level: "SVIP6", coins: 10000, points: 10000 }
];

const table = document.getElementById("levelsTable");

levels.forEach(item => {
    const row = document.createElement("tr");

    [item.level, item.coins.toLocaleString("en-US"),
     item.points.toLocaleString("en-US")].forEach(value => {
        const cell = document.createElement("td");
        cell.textContent = value;
        row.appendChild(cell);
    });

    table.appendChild(row);
});

function applyStrings() {
        const lang = (navigator.language || "en")
            .split("-")[0]
            .toLowerCase();

        if (typeof strings === "undefined") return;

        document.querySelectorAll("[data-string]").forEach(element => {
            const key = element.getAttribute("data-string");

            const value =
                (strings[lang] && strings[lang][key]) ||
                (strings.en && strings.en[key]);

            if (value) {
                element.textContent = value;
            }
        });
    }
</script>
<script src="strings-svip-information.js" onload="applyStrings()"></script>
</body>
</html>
