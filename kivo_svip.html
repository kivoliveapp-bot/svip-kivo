<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIVO — SVIP</title>
  <style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Tahoma,sans-serif;background:#090611;color:#fff}
body{overflow-x:hidden}
.app{min-height:100vh;background:radial-gradient(circle at 50% -10%,#6e4d23 0,transparent 34%),radial-gradient(circle at 100% 35%,#29134c 0,transparent 32%),linear-gradient(180deg,#100719,#08050d 72%);padding:20px 14px 42px}
.wrap{max-width:520px;margin:auto}
.hero{text-align:center;padding:8px 0 16px}
.hero h1{font-size:30px;margin:5px 0 7px;background:linear-gradient(90deg,#fff,#ffd66e,#eab8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:#b2ab9b;font-size:13px}
.panel{border:1px solid #ffffff12;background:linear-gradient(145deg,#ffffff0d,#ffffff04);border-radius:28px;padding:18px;box-shadow:0 18px 60px #0008;backdrop-filter:blur(12px)}
.current{text-align:center}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:#f4c85f16;border:1px solid #f4c85f55;color:#ffe49a;font-weight:800;font-size:12px}
.necklace{height:250px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.necklace:before{content:"";position:absolute;width:210px;height:170px;border-radius:50%;background:var(--glow,#f3c76b);filter:blur(58px);opacity:.18}
.necklace img{width:240px;height:240px;max-width:100%;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 12px 25px #0009);transition:opacity .35s,transform .35s}
.level-title{font-size:28px;font-weight:900;margin-top:0;color:var(--glow,#f3c76b)}
.charge-label{color:#b9adbf;font-size:12px;margin-top:6px}
.charge-value{font-size:18px;font-weight:800;margin-top:5px;color:#ffe29a}
.progress{height:10px;background:#ffffff10;border-radius:99px;overflow:hidden;margin:15px 0 7px;border:1px solid #ffffff0c}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#9f5bff,#ffb6df,#ffe08a);box-shadow:0 0 16px #eaa8ff66;transition:width .5s}
.progress-row{display:flex;justify-content:space-between;gap:8px;color:#a99eb0;font-size:10px}
.switch-title{font-size:14px;font-weight:800;margin:20px 3px 10px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.level-card{cursor:pointer;color:#fff;text-align:right;border:1px solid #ffffff10;background:#ffffff06;border-radius:17px;padding:11px 9px;min-width:0;transition:.25s}
.level-card:hover,.level-card.active{transform:translateY(-3px);border-color:var(--accent);background:linear-gradient(145deg,#ffffff12,#ffffff06);box-shadow:0 8px 25px #0005}
.level-mini{color:var(--accent);font-size:15px;height:18px}
.level-card-name{font-size:13px;font-weight:900;margin-top:3px}
.level-card-charge{font-size:9px;color:#a99eb0;margin-top:5px}
.mini-bar{height:4px;background:#ffffff0b;border-radius:10px;margin-top:9px;overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--accent);border-radius:10px}
.features{margin-top:20px}
.features h2{font-size:16px;margin:0 0 12px}
.features ul{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.features li{display:flex;align-items:center;gap:10px;background:#ffffff06;border:1px solid #ffffff08;padding:11px 12px;border-radius:14px;color:#ddd5e1;font-size:12px}
.features li .check{display:grid;place-items:center;flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:#e9bb6217;color:#ffd878;font-weight:900}
.auto{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;color:#a99eb0;font-size:11px}
.dot{width:7px;height:7px;background:#e6b75a;border-radius:50%;box-shadow:0 0 12px #e6b75a}
.note{text-align:center;color:#756a7c;font-size:10px;margin-top:15px;line-height:1.7}
@media(max-width:380px){.levels{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="wrap">
    <section class="hero">
      <h1><div data-string="svip2"></div></h1>
      <p><div data-string="svip1"></div></p>
    </section>

    <main class="panel">
      <div class="current">
        <div class="badge">✦ <span id="badgeName">SVIP 1</span></div>
        <div class="necklace" id="necklaceBox"></div>
        <div class="level-title" id="levelTitle">SVIP 1</div>
        <div class="charge-label"><div data-string="svip3"></div></div>
        <div class="charge-value" id="chargeValue">100$</div>
        <div class="progress"><i id="progress"></i></div>
        <div class="progress-row">
          <span><div data-string="svip6"></div><b id="progressText">0$</b></span>
          <span id="nextText"><div data-string="svip4"></div></span>
        </div>
      </div>

      <div class="switch-title"><div data-string="svip5"></div></div>
      <div class="levels">
        <button type="button" class="level-card" data-level="1" style="--accent:#f3c76b">
          <div class="level-mini"></div><div class="level-card-name">SVIP 1</div>
          <div class="level-card-charge">100$ <div data-string="svip8"></div></div><div class="mini-bar"><i style="width:30%"></i></div>
        </button>
        <button type="button" class="level-card" data-level="2" style="--accent:#f39bd7">
          <div class="level-mini"></div><div class="level-card-name">SVIP 2</div>
          <div class="level-card-charge">500$ <div data-string="svip8"></div></div><div class="mini-bar"><i style="width:42%"></i></div>
        </button>
        <button type="button" class="level-card" data-level="3" style="--accent:#c9a7ff">
          <div class="level-mini"></div><div class="level-card-name">SVIP 3</div>
          <div class="level-card-charge">1,000$ <div data-string="svip8"></div></div><div class="mini-bar"><i style="width:54%"></i></div>
        </button>
        <button type="button" class="level-card" data-level="4" style="--accent:#72d7ff">
          <div class="level-mini"></div><div class="level-card-name">SVIP 4</div>
          <div class="level-card-charge">3,000$ <div data-string="svip8"></div></div><div class="mini-bar"><i style="width:66%"></i></div>
        </button>
        <button type="button" class="level-card" data-level="5" style="--accent:#ff9b63">
          <div class="level-mini"></div><div class="level-card-name">SVIP 5</div>
          <div class="level-card-charge">7,000$ <div data-string="svip8"></div></div><div class="mini-bar"><i style="width:78%"></i></div>
        </button>
        <button type="button" class="level-card" data-level="6" style="--accent:#ffe58a">
          <div class="level-mini"></div><div class="level-card-name">SVIP 6</div>
          <div class="level-card-charge">10,000$+ <div data-string="svip8"></div></div><div class="mini-bar"><i style="width:90%"></i></div>
        </button>
      </div>

      <div class="features">
        <h2><div data-string="svip7"></div></h2>
        <ul id="features"></ul>
      </div>
      <div class="auto"><span class="dot"></span><span id="statusText">يتم تحديد مستواك تلقائيًا حسب إجمالي الشحن</span></div>
    </main>
  </div>
</div>

<script>
"use strict";

const levels = [
{id:1,name:"SVIP 1",min:100,next:500,color:"#f3c76b",features:["SVIP 1 badge next to your name","Special SVIP 1 pendant on your profile","Simple SVIP entry effect","Exclusive profile frame"]},
{id:2,name:"SVIP 2",min:500,next:1000,color:"#f39bd7",features:["Upgraded SVIP 2 badge","SVIP 2 pendant","Distinctive entry effect","Premium profile frame"]},
{id:3,name:"SVIP 3",min:1000,next:3000,color:"#c9a7ff",features:["SVIP 3 badge","Advanced exclusive pendant","Glowing entry effect","Animated profile frame"]},
{id:4,name:"SVIP 4",min:3000,next:7000,color:"#72d7ff",features:["Premium SVIP 4 badge","Royal pendant","Shining entry effect","Luxury profile frame"]},
{id:5,name:"SVIP 5",min:7000,next:10000,color:"#ff9b63",features:["Gold SVIP 5 badge","Legendary pendant","Powerful entry effect","Advanced VIP profile frame"]},
{id:6,name:"SVIP 6",min:10000,next:null,color:"#ffe58a",features:["Legendary SVIP 6 badge","Royal SVIP 6 pendant","Legendary entry effect","Highly exclusive profile frame"]}
];

const necklaceImages = {
  1:"svip1.png",
  2:"svip2.png",
  3:"svip3.png",
  4:"svip4.png",
  5:"svip5.png",
  6:"svip6.png"
};

let rechargePoints = 0;
let current = 1;
let rechargeReceived = false;

function money(value) {
  return Number(value).toLocaleString("en-US") + "$";
}

function levelForRecharge(value) {
  let selected = levels[0];

  for (const level of levels) {
    if (value >= level.min) {
      selected = level;
    }
  }

  return selected;
}

function fallbackSvg(n) {
  const l = levels[n - 1];

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff5c2"/>
        <stop offset=".45" stop-color="${l.color}"/>
        <stop offset="1" stop-color="#9b6a19"/>
      </linearGradient>
    </defs>
    <path d="M48 20 Q100 95 152 20" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round"/>
    <path d="M100 75 L143 115 L100 170 L57 115 Z" fill="url(#g)" stroke="#9b6a19" stroke-width="3"/>
    <path d="M100 94 L120 115 L100 145 L80 115 Z" fill="#fff2b3" opacity=".8"/>
    <circle cx="100" cy="115" r="7" fill="#fff"/>
  </svg>`;

  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}

function render(n, animate = true) {
  if (!Number.isInteger(n) || n < 1 || n > levels.length) {
    return;
  }

  current = n;
  const l = levels[n - 1];

  document.documentElement.style.setProperty("--glow", l.color);

  document.getElementById("badgeName").textContent = l.name;
  document.getElementById("levelTitle").textContent = l.name;

  document.getElementById("chargeValue").textContent = money(l.min);

  document.getElementById("progressText").textContent =
    money(rechargePoints);

  document.getElementById("nextText").textContent =
    l.next === null
      ? "تم الوصول إلى أعلى مستوى"
      : "Next level: " + money(l.next);

  let progress = 100;

  if (l.next !== null) {
    progress = Math.max(0, Math.min(100,
      ((rechargePoints - l.min) / (l.next - l.min)) * 100
    ));
  }

  document.getElementById("progress").style.width =
    progress + "%";

  // المميزات
  const features = document.getElementById("features");
  features.replaceChildren();

  l.features.forEach(feature => {
    const li = document.createElement("li");

    const check = document.createElement("span");
    check.className = "check";
    check.textContent = "✓";

    const text = document.createElement("span");
    text.textContent = feature;

    li.append(check, text);
    features.appendChild(li);
  });

  const box = document.getElementById("necklaceBox");
  box.replaceChildren();

  const img = document.createElement("img");
  img.alt = l.name;
  img.src = necklaceImages[n];

  img.onerror = function() {
    this.onerror = null;
    this.src = fallbackSvg(n);
  };

  box.appendChild(img);

  document.querySelectorAll(".level-card").forEach(card => {
    card.classList.toggle(
      "active",
      Number(card.dataset.level) === n
    );
  });

  if (animate) {
    img.style.opacity = "0";
    img.style.transform = "scale(.82) rotate(-5deg)";

    requestAnimationFrame(() => {
      img.style.opacity = "1";
      img.style.transform = "scale(1) rotate(0)";
    });
  }
}

function setRechargePoints(value) {
  rechargePoints = Math.max(
    0,
    Math.floor(Number(value) || 0)
  );

  rechargeReceived = true;

  const level = levelForRecharge(rechargePoints);

  document.getElementById("statusText").textContent =
    "Your current level " + level.name;

  render(level.id);
}

document.querySelectorAll(".level-card").forEach(card => {
card.addEventListener("click", () => {
document.getElementById("statusText").textContent =
rechargeReceived
? "Level Preview — Your total recharge: " + money(rechargePoints)
: "Waiting for user points to load from the app";

render(Number(card.dataset.level));
});
});

render(1, false);

window.setRechargePoints = setRechargePoints;

function applyStrings() {
        const lang = (navigator.language || "en")
            .split("-")[0]
            .toLowerCase();

        if (typeof strings === "undefined") return;

        document.querySelectorAll("[data-string]").forEach(element => {
            const key = element.getAttribute("data-string");

            const value =
                (strings[lang] && strings[lang][key]) ||
                (strings.en && strings.en[key]);

            if (value) {
                element.textContent = value;
            }
        });
    }
</script>

<script src="strings-svip.js" onload="applyStrings()"></script>

</body>
</html>
